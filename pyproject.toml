[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galiatsatos-plabn"
version = "1.0.0"
description = "GALIATSATOS outcome-definition alignment framework with the PLA-BN Bayesian reference estimator"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Dimitrios Galiatsatos", email = "galiatsatos.dimitrios@ac.eap.gr"}
]
keywords = [
  "Bayesian networks",
  "heterogeneous outcome definitions",
  "coarse labels",
  "Structural EM",
  "probabilistic transport",
  "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/dgaliatsatos2010/GALIATSATOS-PLA-BN"
Repository = "https://github.com/dgaliatsatos2010/GALIATSATOS-PLA-BN"
Documentation = "https://github.com/dgaliatsatos2010/GALIATSATOS-PLA-BN#readme"
"Archived release" = "https://doi.org/10.5281/zenodo.22079293"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
