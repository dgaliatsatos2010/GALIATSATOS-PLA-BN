[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galiatsatos-method"
version = "1.0.0"
description = "GALIATSATOS rank-gated outcome-definition alignment method with a PLA-BN reference estimator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
benchmark = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]
dev = [
  "pytest>=7.4",
  "jupyter>=1.0",
  "nbformat>=5.9",
  "nbclient>=0.8",
]

[project.scripts]
plabn-benchmark = "run_benchmark:main"
plabn-publication-experiments = "publication_experiments:main"
galiatsatos-benchmark = "run_benchmark:main"
galiatsatos-real-validation = "real_data_validation:main"
galiatsatos-validate-real-results = "validate_real_data_results:main"
galiatsatos-convergence-audit = "convergence_stress_test:main"
galiatsatos-heart-multicohort = "multicohort_heart_validation:main"
galiatsatos-nhanes-diabetes = "nhanes_diabetes_validation:main"
galiatsatos-nhanes-repeated = "nhanes_diabetes_repeated_validation:main"

[tool.setuptools]
py-modules = ["plabn", "galiatsatos_method", "synthetic", "run_benchmark", "publication_experiments", "real_data_validation", "validate_real_data_results", "convergence_stress_test", "multicohort_heart_validation", "nhanes_diabetes_validation", "nhanes_diabetes_repeated_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
